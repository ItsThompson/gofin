groups:
  - name: hardware
    rules:
      - alert: ContainerHighCPU
        expr: |
          (
            sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name)
            / on(name)
            (sum(container_spec_cpu_quota{name!=""}) by (name) / sum(container_spec_cpu_period{name!=""}) by (name))
            > 0.9
          )
          and on(name)
          sum(container_spec_cpu_quota{name!=""}) by (name) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} CPU > 90% of limit"

      - alert: ContainerHighMemory
        expr: |
          container_memory_working_set_bytes{name!=""}
          / container_spec_memory_limit_bytes{name!=""}
          > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} memory > 90% of limit"

      - alert: HostDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})
          < 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host filesystem {{ $labels.mountpoint }} has < 10% free"

      - alert: HostHighMemory
        expr: |
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host memory usage > 90%"

      - alert: HostHighCPU
        expr: |
          1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host CPU usage > 90%"

      - alert: HostDiskFillingUp
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*60*60
          ) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem {{ $labels.mountpoint }} predicted to fill within 24h"
