groups:
  - name: service-health
    rules:
      # Per-job sums stop healthy traffic elsewhere diluting a failing service.
      # The floor stops a handful of requests in the window setting the ratio.
      - alert: HighErrorRate
        expr: |
          (
            sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (job) (rate(http_requests_total[5m]))
            > 0.05
          )
          and
          (
            sum by (job) (rate(http_requests_total[5m])) > 2 / 60
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 5xx error rate is {{ $value | humanizePercentage }} (> 5%)"
          description: "More than 5% of requests to {{ $labels.job }} returned 5xx over 5 minutes, with more than 2 requests per minute of traffic."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"

      - alert: SlowQueries
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 query duration > 1s for {{ $labels.query_name }}"

      - alert: AuthFailuresSpike
        expr: rate(http_requests_total{job="auth-service",path="/api/auth/login",status="401"}[1m]) > 10
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "> 10 failed logins in 1 minute"

      # Recovery keeps the process alive, so `up` stays 1 and the request counters
      # never see the call: this counter is the only Prometheus signal a panic
      # leaves. Any increment is a defect, because a dead client connection is
      # classified before the shared reporter counts anything, so the rule fires on
      # one panic with no `for` delay. Summed by job and site to drop `instance`.
      - alert: RecoveredPanic
        expr: sum by (job, site) (increase(recovered_panics_total[5m])) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} recovered a panic at {{ $labels.site }}"
          description: "A panic was recovered at {{ $labels.site }} in {{ $labels.job }} within the last 5 minutes. The process survived, so no other alert covers it. The panic value and its stack are in that service's log stream."

  - name: datarights
    rules:
      - alert: ExportJobFailureRate
        expr: |
          sum(rate(export_jobs_completed_total{status="failed"}[1h]))
          / sum(rate(export_jobs_completed_total[1h])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High export job failure rate"
          description: "More than 50% of export jobs failed in the last hour."

      - alert: ExportJobStuck
        expr: export_pool_active_jobs > 0 and sum(changes(export_jobs_completed_total[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Export job appears stuck"
          description: "Active jobs exist but no completions in 10 minutes."
