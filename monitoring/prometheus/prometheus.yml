global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "hardware_alerts.yml"
  - "recording_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: expense-service
    static_configs:
      - targets: ["expense-service:8082"]

  - job_name: finance-service
    static_configs:
      - targets: ["finance-service:8083"]

  - job_name: datarights-service
    static_configs:
      - targets: ["datarights-service:8084"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
