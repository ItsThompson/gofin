[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
auto_sign_up = true
# Whitelist restricts which IPs can send the X-WEBAUTH-USER header.
# 172.16.0.0/12 covers Docker bridge network ranges where the auth proxy runs.
# For production with non-Docker proxies, narrow this to the proxy's specific IP.
whitelist = 172.16.0.0/12

[auth.anonymous]
enabled = false

[server]
enable_gzip = true

[dataproxy]
timeout = 30

[unified_alerting]
# Reduce evaluation overhead on constrained hardware.
min_interval = 30s
