global:
  resolve_timeout: 5m

route:
  receiver: discord-warning
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: discord-critical
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: discord-critical
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_URL}"
        # group_by includes job, so GroupLabels names the failing service.
        # Hardware alerts carry no job label, hence the guard.
        title: '🚨 [CRITICAL] {{ .GroupLabels.alertname }}{{ if .GroupLabels.job }} · {{ .GroupLabels.job }}{{ end }}'
        message: '{{ range .Alerts }}**{{ .Annotations.summary }}**\n{{ end }}'
        send_resolved: true

  - name: discord-warning
    discord_configs:
      - webhook_url: "${DISCORD_WEBHOOK_URL}"
        title: '⚠️ [WARNING] {{ .GroupLabels.alertname }}{{ if .GroupLabels.job }} · {{ .GroupLabels.job }}{{ end }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
        send_resolved: true
