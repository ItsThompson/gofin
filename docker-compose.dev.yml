services:
  # ---------------------------------------------------------------------------
  # Dev overrides: volume mounts, debug ports, relaxed security
  # ---------------------------------------------------------------------------
  mfe:
    environment:
      - COOKIE_SECURE=false
      - NODE_ENV=development
    command: sh -lc "cd /app && npm ci && npm run dev --workspace=@gofin/shell"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  api-gateway:
    volumes:
      - ./services/gateway:/app
    ports:
      - "40000:40000"
    environment:
      - ENVIRONMENT=development

  auth-service:
    volumes:
      - ./services/auth:/app
    ports:
      - "40001:40001"
    environment:
      - BCRYPT_COST=4
      - ENVIRONMENT=development

  expense-service:
    volumes:
      - ./services/expense:/app
    ports:
      - "40002:40002"
    environment:
      - ENVIRONMENT=development

  finance-service:
    volumes:
      - ./services/finance:/app
    ports:
      - "40003:40003"
    environment:
      - ENVIRONMENT=development

  # Overlay for the internal-only FX Service. The internal-only/no-browser-route
  # rule lives in docker-compose.yml; this block only adds dev volumes and ports.
  fx-service:
    volumes:
      - ./services/fx:/app
    ports:
      - "40005:40005"
    environment:
      - ENVIRONMENT=development
      - OPEN_EXCHANGE_RATES_APP_ID=${OPEN_EXCHANGE_RATES_APP_ID:-dev-open-exchange-rates-app-id}
