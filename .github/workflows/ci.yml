name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/**/go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
          working-directory: services
          args: ./auth/... ./expense/... ./finance/... ./gateway/... ./metrics/...

  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx turbo lint
        working-directory: frontend

  test-backend:
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: services/**/go.sum

      - name: Run backend tests
        working-directory: services
        run: |
          go work sync
          (cd auth && go test ./...)
          (cd expense && go test ./...)
          (cd finance && go test ./...)
          (cd gateway && go test ./...)

  test-frontend:
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx turbo test
        working-directory: frontend

  e2e:
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for containers to start..."
          sleep 10
          docker compose ps

          echo "Waiting for frontend..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "  Frontend is up (attempt ${i}/60)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Frontend did not become healthy in time"
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi
            sleep 5
          done

          echo "Waiting for API gateway..."
          for i in $(seq 1 60); do
            # Gateway requires auth on /api/health, so check /metrics directly (no auth needed)
            if curl -sf -o /dev/null http://localhost:8080/metrics; then
              echo "  API gateway is up (attempt ${i}/60)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: API gateway did not become healthy in time"
              docker compose ps
              docker compose logs --tail=50
              exit 1
            fi
            sleep 5
          done

      - name: Seed admin user
        run: docker compose exec -T auth-service /service seed-admin

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Create E2E .env.test from example
        working-directory: e2e
        run: cp .env.test.example .env.test

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Capture Docker Compose logs
        if: failure()
        run: docker compose logs --no-color > /tmp/docker-compose-logs.txt 2>&1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-compose-logs
          path: /tmp/docker-compose-logs.txt
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down
