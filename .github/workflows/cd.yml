name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - service: mfe
            context: ./frontend
            file: ./frontend/Dockerfile
          - service: api-gateway
            context: ./services
            file: ./services/gateway/Dockerfile
          - service: auth-service
            context: ./services
            file: ./services/auth/Dockerfile
          - service: expense-service
            context: ./services
            file: ./services/expense/Dockerfile
          - service: finance-service
            context: ./services
            file: ./services/finance/Dockerfile
          - service: grafana-auth-proxy
            context: ./monitoring/auth-proxy
            file: ./monitoring/auth-proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/itsthompson/gofin/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decode tunnel credentials
        run: |
          mkdir -p deployments/cloudflare
          echo "${{ secrets.CF_APP_CREDENTIALS }}" | base64 -d > deployments/cloudflare/gofin-app.json
          echo "${{ secrets.CF_GRAFANA_CREDENTIALS }}" | base64 -d > deployments/cloudflare/gofin-grafana.json
          echo "${{ secrets.CF_CERT_PEM }}" | base64 -d > deployments/cloudflare/cert.pem

      - name: Validate credential files exist
        run: |
          for f in deployments/cloudflare/gofin-app.json deployments/cloudflare/gofin-grafana.json deployments/cloudflare/cert.pem; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing. Check GitHub Secrets configuration."
              exit 1
            fi
          done
          echo "All credential files decoded successfully."

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: ./scripts/deploy.sh ${{ secrets.DEPLOY_SERVER_IP }}
