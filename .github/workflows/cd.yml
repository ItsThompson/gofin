name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover buildable services from docker-compose.yml
        id: set-matrix
        run: |
          # Use 'docker compose config' (official parser) to extract buildable services.
          # Filters to ghcr.io/itsthompson/gofin/* images and converts absolute paths to relative.
          matrix=$(docker compose config --format json | jq -c --arg pwd "$PWD" '
            [.services | to_entries[] | select(.value.image | test("^ghcr\\.io/itsthompson/gofin/")) | {
              "service": (.value.image | sub("ghcr\\.io/itsthompson/gofin/"; "") | sub(":.*"; "")),
              "context": ("." + (.value.build.context | ltrimstr($pwd))),
              "file": ("." + ((.value.build.context + "/" + .value.build.dockerfile) | ltrimstr($pwd)))
            }]')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Discovered services:"
          echo "$matrix" | jq -r '.[].service'

  build-and-push:
    needs: [discover]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 15
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/itsthompson/gofin/${{ matrix.service }}:latest
            ghcr.io/itsthompson/gofin/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decode tunnel credentials
        run: |
          mkdir -p deployments/cloudflare
          echo "${{ secrets.CF_APP_CREDENTIALS }}" | base64 -d > deployments/cloudflare/gofin-app.json
          echo "${{ secrets.CF_CERT_PEM }}" | base64 -d > deployments/cloudflare/cert.pem

      - name: Validate credential files exist
        run: |
          for f in deployments/cloudflare/gofin-app.json deployments/cloudflare/cert.pem; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing. Check GitHub Secrets configuration."
              exit 1
            fi
          done
          echo "All credential files decoded successfully."

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: ./scripts/deploy.sh ${{ secrets.DEPLOY_SERVER_IP }}
        env:
          DEPLOY_SHA: ${{ github.sha }}
