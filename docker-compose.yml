# =============================================================================
# Image version pinning: all third-party images are pinned to exact versions.
# Review and update quarterly. Check release notes before bumping.
# Last reviewed: 2026-05-12
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Node 1: Edge (MFE + Cloudflare tunnels)
  # ---------------------------------------------------------------------------
  mfe:
    image: ghcr.io/itsthompson/gofin/mfe:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle. Local and CI builds only: the CD runner
        # cannot read /opt/gofin/.env, so it passes vars.SENTRY_DSN_FRONTEND.
        - VITE_SENTRY_DSN=${SENTRY_DSN_FRONTEND:-}
        - VITE_SENTRY_RELEASE=${SENTRY_RELEASE:-}
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
      - COOKIE_SECURE=true
      # Read at runtime by the SSR process, which never sees the build args.
      - SENTRY_DSN=${SENTRY_DSN_FRONTEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - edge-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  cloudflared-app:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: cloudflare/cloudflared:2025.4.0
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run gofin-app
    volumes:
      - ./deployments/cloudflare/config-app.rendered.yml:/etc/cloudflared/config.yml:ro
      - ./deployments/cloudflare/gofin-app.json:/etc/cloudflared/credentials.json:ro
      - ./deployments/cloudflare/cert.pem:/etc/cloudflared/cert.pem:ro
    networks:
      - edge-net
    depends_on:
      - mfe
    profiles:
      - tunnels
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 2: Compute (API gateway + microservices)
  # ---------------------------------------------------------------------------
  api-gateway:
    image: ghcr.io/itsthompson/gofin/api-gateway:latest
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - AUTH_SERVICE_ADDR=auth-service:9081
      - AUTH_SERVICE_REST=http://auth-service:8081
      - EXPENSE_SERVICE_REST=http://expense-service:8082
      - FINANCE_SERVICE_REST=http://finance-service:8083
      - DATARIGHTS_SERVICE_REST=http://datarights-service:8084
      # Upper bound on the auth ValidateToken gRPC call (parsed as a Go
      # duration, default 3s). Caps tail latency if the auth service hangs;
      # must comfortably exceed a healthy validation (low milliseconds).
      - GATEWAY_VALIDATE_TIMEOUT=${GATEWAY_VALIDATE_TIMEOUT:-3s}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - edge-net
      - compute-net
      - monitoring-net
    depends_on:
      - auth-service
      - expense-service
      - finance-service
      - datarights-service
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  auth-service:
    image: ghcr.io/itsthompson/gofin/auth-service:latest
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    expose:
      - "8081"
      - "9081"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - AUTH_DB_URL=postgres://gofin:gofin@postgresql:5432/gofin?sslmode=disable&search_path=auth
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gofin.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin1234!}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  expense-service:
    image: ghcr.io/itsthompson/gofin/expense-service:latest
    build:
      context: ./services
      dockerfile: expense/Dockerfile
    expose:
      - "8082"
      - "9082"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - IMMUDB_ADDR=immudb:3322
      - IMMUDB_USERNAME=${IMMUDB_USERNAME:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
      - FINANCE_SERVICE_ADDR=finance-service:9083
      - FX_SERVICE_ADDR=fx-service:9085
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      immudb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  finance-service:
    image: ghcr.io/itsthompson/gofin/finance-service:latest
    build:
      context: ./services
      dockerfile: finance/Dockerfile
    expose:
      - "8083"
      - "9083"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - FINANCE_DB_URL=postgres://gofin:gofin@postgresql:5432/gofin?sslmode=disable&search_path=finance
      - EXPENSE_SERVICE_ADDR=expense-service:9082
      - FX_SERVICE_ADDR=fx-service:9085
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    restart: unless-stopped

  # Internal-only compute service. No browser-facing REST route and no gateway
  # proxy prefix: expense-service and finance-service call it over gRPC on
  # compute-net, and Prometheus scrapes it on monitoring-net. It is absent from
  # edge-net and data-net because it owns no user ledger data.
  fx-service:
    image: ghcr.io/itsthompson/gofin/fx-service:latest
    build:
      context: ./services
      dockerfile: fx/Dockerfile
    expose:
      - "8085"
      - "9085"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - OPEN_EXCHANGE_RATES_APP_ID=${OPEN_EXCHANGE_RATES_APP_ID}
      - FX_PROVIDER_TIMEOUT=${FX_PROVIDER_TIMEOUT:-2s}
      - FX_PROVIDER_RETRY_COUNT=${FX_PROVIDER_RETRY_COUNT:-2}
      - FX_CACHE_MAX_AGE=${FX_CACHE_MAX_AGE:-1h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    networks:
      - compute-net
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  datarights-service:
    image: ghcr.io/itsthompson/gofin/datarights-service:latest
    build:
      context: ./services
      dockerfile: datarights/Dockerfile
    expose:
      - "8084"
      - "9084"
    healthcheck:
      test: ["CMD", "/service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      - DATARIGHTS_DB_URL=postgres://gofin:gofin@postgresql:5432/gofin?sslmode=disable&search_path=datarights
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-gofin <noreply@usegofin.com>}
      - BRAND_TOKENS_PATH=/app/tokens/brand.json
    volumes:
      - ./tokens/brand.json:/app/tokens/brand.json:ro
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 3: Data (PostgreSQL + immudb)
  # ---------------------------------------------------------------------------
  postgresql:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: postgres:16.8-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=gofin
      - POSTGRES_PASSWORD=gofin
      - POSTGRES_DB=gofin
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofin"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    restart: unless-stopped

  immudb:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: codenotary/immudb:1.11.0
    ports:
      - "3322:3322"
    volumes:
      - immudata:/var/lib/immudb
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 4: Monitoring (Prometheus, Alertmanager, Grafana, auth proxy, tunnel)
  # ---------------------------------------------------------------------------
  prometheus:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: prom/prometheus:v3.11.3
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=2GB'
      - '--query.max-concurrency=5'
      - '--query.timeout=30s'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/hardware_alerts.yml:/etc/prometheus/hardware_alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - promdata:/prometheus
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
    restart: unless-stopped

  cadvisor:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  node-exporter:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: prom/node-exporter:v1.11.1
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 64M
    restart: unless-stopped

  alertmanager:
    image: ghcr.io/itsthompson/gofin/alertmanager:latest
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    ports:
      - "9093:9093"
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
    restart: unless-stopped

  grafana:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: grafana/grafana:11.6.0
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  grafana-auth-proxy:
    image: ghcr.io/itsthompson/gofin/grafana-auth-proxy:latest
    build:
      context: ./monitoring/auth-proxy
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GRAFANA_URL=http://grafana:3000
      - APP_URL=${APP_URL:-http://localhost:3000}
    networks:
      - monitoring-net
    depends_on:
      - grafana
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  cloudflared-grafana:
    # Pinned 2026-05-12. Check for updates quarterly.
    image: cloudflare/cloudflared:2025.4.0
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run gofin-grafana
    volumes:
      - ./deployments/cloudflare/config-grafana.rendered.yml:/etc/cloudflared/config.yml:ro
      - ./deployments/cloudflare/gofin-grafana.json:/etc/cloudflared/credentials.json:ro
      - ./deployments/cloudflare/cert.pem:/etc/cloudflared/cert.pem:ro
    networks:
      - monitoring-net
    depends_on:
      - grafana-auth-proxy
    profiles:
      - tunnels
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  edge-net:
    driver: bridge
  compute-net:
    driver: bridge
  data-net:
    driver: bridge
  monitoring-net:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  immudata:
  promdata:
