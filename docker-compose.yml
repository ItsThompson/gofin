services:
  # ---------------------------------------------------------------------------
  # Node 1: Edge (MFE + Cloudflare tunnels)
  # ---------------------------------------------------------------------------
  mfe:
    image: ghcr.io/itsthompson/gofin/mfe:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
      - COOKIE_SECURE=true
    networks:
      - edge-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  cloudflared-app:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run gofin-app
    volumes:
      - ./deployments/cloudflare/config-app.rendered.yml:/etc/cloudflared/config.yml:ro
      - ./deployments/cloudflare/gofin-app.json:/etc/cloudflared/credentials.json:ro
      - ./deployments/cloudflare/cert.pem:/etc/cloudflared/cert.pem:ro
    networks:
      - edge-net
    depends_on:
      - mfe
    profiles:
      - tunnels
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 2: Compute (API gateway + microservices)
  # ---------------------------------------------------------------------------
  api-gateway:
    image: ghcr.io/itsthompson/gofin/api-gateway:latest
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_ADDR=auth-service:9081
      - AUTH_SERVICE_REST=http://auth-service:8081
      - EXPENSE_SERVICE_REST=http://expense-service:8082
      - FINANCE_SERVICE_REST=http://finance-service:8083
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - edge-net
      - compute-net
      - monitoring-net
    depends_on:
      - auth-service
      - expense-service
      - finance-service
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  auth-service:
    image: ghcr.io/itsthompson/gofin/auth-service:latest
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      - AUTH_DB_URL=postgres://gofin:gofin@postgresql:5432/gofin?sslmode=disable&search_path=auth
      - JWT_SECRET=${JWT_SECRET}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gofin.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin1234!}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  expense-service:
    image: ghcr.io/itsthompson/gofin/expense-service:latest
    build:
      context: ./services
      dockerfile: expense/Dockerfile
    ports:
      - "8082:8082"
      - "9082:9082"
    environment:
      - IMMUDB_ADDR=immudb:3322
      - IMMUDB_USERNAME=${IMMUDB_USERNAME:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      immudb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  finance-service:
    image: ghcr.io/itsthompson/gofin/finance-service:latest
    build:
      context: ./services
      dockerfile: finance/Dockerfile
    ports:
      - "8083:8083"
      - "9083:9083"
    environment:
      - FINANCE_DB_URL=postgres://gofin:gofin@postgresql:5432/gofin?sslmode=disable&search_path=finance
      - EXPENSE_SERVICE_ADDR=expense-service:9082
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    networks:
      - compute-net
      - data-net
      - monitoring-net
    depends_on:
      postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 3: Data (PostgreSQL + immudb)
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gofin
      - POSTGRES_PASSWORD=gofin
      - POSTGRES_DB=gofin
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./services/auth/db/migrations/000001_create_users.up.sql:/docker-entrypoint-initdb.d/02-auth-001.sql:ro
      - ./services/auth/db/migrations/000002_create_refresh_token_blacklist.up.sql:/docker-entrypoint-initdb.d/03-auth-002.sql:ro
      - ./services/finance/db/migrations/000001_create_budget_periods.up.sql:/docker-entrypoint-initdb.d/04-finance-001.sql:ro
      - ./services/finance/db/migrations/000002_create_default_settings.up.sql:/docker-entrypoint-initdb.d/05-finance-002.sql:ro
      - ./services/finance/db/migrations/000003_create_tags.up.sql:/docker-entrypoint-initdb.d/06-finance-003.sql:ro
      - ./services/finance/db/migrations/000004_create_pro_rata_schedules.up.sql:/docker-entrypoint-initdb.d/07-finance-004.sql:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofin"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    restart: unless-stopped

  immudb:
    image: codenotary/immudb:latest
    ports:
      - "3322:3322"
    volumes:
      - immudata:/var/lib/immudb
    networks:
      - data-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node 4: Monitoring (Prometheus, Alertmanager, Grafana, auth proxy, tunnel)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=2GB'
      - '--query.max-concurrency=5'
      - '--query.timeout=30s'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/hardware_alerts.yml:/etc/prometheus/hardware_alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - promdata:/prometheus
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1024M
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 64M
    restart: unless-stopped

  alertmanager:
    image: ghcr.io/itsthompson/gofin/alertmanager:latest
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    ports:
      - "9093:9093"
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    restart: unless-stopped

  grafana-auth-proxy:
    image: ghcr.io/itsthompson/gofin/grafana-auth-proxy:latest
    build:
      context: ./monitoring/auth-proxy
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GRAFANA_URL=http://grafana:3000
      - APP_URL=${APP_URL:-http://localhost:3000}
    networks:
      - monitoring-net
    depends_on:
      - grafana
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  cloudflared-grafana:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run gofin-grafana
    volumes:
      - ./deployments/cloudflare/config-grafana.rendered.yml:/etc/cloudflared/config.yml:ro
      - ./deployments/cloudflare/gofin-grafana.json:/etc/cloudflared/credentials.json:ro
      - ./deployments/cloudflare/cert.pem:/etc/cloudflared/cert.pem:ro
    networks:
      - monitoring-net
    depends_on:
      - grafana-auth-proxy
    profiles:
      - tunnels
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  edge-net:
    driver: bridge
  compute-net:
    driver: bridge
  data-net:
    driver: bridge
  monitoring-net:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  immudata:
  promdata:
