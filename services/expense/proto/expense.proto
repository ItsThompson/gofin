syntax = "proto3";

package expense;

option go_package = "github.com/ItsThompson/gofin/services/expense/proto/expensepb";

service ExpenseService {
  rpc CreateExpense(CreateExpenseRequest) returns (ExpenseResponse);
  rpc CreateProRataInstallment(CreateProRataInstallmentRequest) returns (ExpenseResponse);
  rpc GetExpensesForPeriod(GetExpensesForPeriodRequest) returns (ExpenseListResponse);
  rpc GetExpense(GetExpenseRequest) returns (ExpenseResponse);

  // Tag usage check (called by finance service during tag deletion)
  rpc CountExpensesByTag(CountExpensesByTagRequest) returns (CountExpensesByTagResponse);

  // Data export streaming: the server streams every expense (active + corrected)
  // for a user in chronological order (created_at ASC, id ASC). The server pages
  // internally with a keyset cursor, bounding server memory to O(page_size); the
  // client writes rows incrementally.
  rpc StreamAllUserExpenses(StreamAllUserExpensesRequest) returns (stream ExpenseData);

  // GDPR: anonymize all expenses for a user (field redaction, not deletion)
  rpc AnonymizeAllUserExpenses(AnonymizeRequest) returns (AnonymizeResponse);

  // Correction flow (mutates the ledger; REST is the primary consumer).
  rpc CorrectExpense(CorrectExpenseRequest) returns (ExpenseResponse);
}

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

message ExpenseData {
  string id = 1;
  string user_id = 2;
  string name = 3;
  reserved 4, 5;
  string expense_type = 6;
  string tag_id = 7;
  string expense_date = 8;
  int32 period_year = 9;
  int32 period_month = 10;
  string status = 11;
  string corrects_id = 12;
  bool is_pro_rata = 13;
  string pro_rata_group = 14;
  int32 pro_rata_index = 15;
  int32 pro_rata_total = 16;
  string created_at = 17;
  string transaction_currency = 18;
  // Money snapshot fields.
  int64 transaction_amount = 20;
  int64 reporting_amount = 21;
  string reporting_currency = 22;
  string exchange_rate = 23;
  string exchange_rate_source = 24;
  string exchange_rate_timestamp = 25;
  string exchange_rate_expires_at = 26;
}

// ---------------------------------------------------------------------------
// CreateExpense
// ---------------------------------------------------------------------------

message CreateExpenseRequest {
  string user_id = 1;
  string name = 2;
  int64 amount = 3;
  reserved 4;
  string expense_type = 5;
  string tag_id = 6;
  string expense_date = 7;
  int32 period_year = 8;
  int32 period_month = 9;
  bool is_pro_rata = 10;
  string pro_rata_group = 11;
  int32 pro_rata_index = 12;
  int32 pro_rata_total = 13;
  string transaction_currency = 14;
  // Client-generated idempotency key (RFC 4122 UUID). Required: a retry with
  // the same key returns the already-created expense instead of a duplicate.
  string client_generated_idempotency_key = 15;
}

message ExpenseResponse {
  ExpenseData expense = 1;
}

// TrustedPeriodContext is period context Finance resolved before asking Expense
// to write a pro-rata installment. Expense validates its consistency but does
// not call Finance again for Finance-originated pro-rata writes.
message TrustedPeriodContext {
  string period_id = 1;
  string user_id = 2;
  int32 year = 3;
  int32 month = 4;
  string reporting_currency = 5;
  string source = 6;
}

// CapturedRateSnapshot is a full USD-based provider snapshot captured at
// pro-rata schedule creation. Future installments derive target reporting
// amounts from this snapshot instead of live rates.
message CapturedRateSnapshot {
  int32 snapshot_version = 1;
  string source = 2;
  string base_currency = 3;
  string rate_timestamp = 4;
  string captured_at = 5;
  string expires_at = 6;
  map<string, string> rates_by_currency = 7;
}

// CreateProRataInstallmentRequest is the Finance-originated internal write
// contract for the first (and future) pro-rata installments.
message CreateProRataInstallmentRequest {
  string user_id = 1;
  TrustedPeriodContext period_context = 2;
  string name = 3;
  int64 amount = 4;
  string transaction_currency = 5;
  string expense_type = 6;
  string tag_id = 7;
  string expense_date = 8;
  string pro_rata_group = 9;
  int32 pro_rata_index = 10;
  int32 pro_rata_total = 11;
  CapturedRateSnapshot captured_rate_snapshot = 12;
}

// ---------------------------------------------------------------------------
// GetExpensesForPeriod
// ---------------------------------------------------------------------------

message GetExpensesForPeriodRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ExpenseListResponse {
  repeated ExpenseData data = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

// ---------------------------------------------------------------------------
// GetExpense
// ---------------------------------------------------------------------------

message GetExpenseRequest {
  string id = 1;
  string user_id = 2;
}

// ---------------------------------------------------------------------------
// CorrectExpense request
// ---------------------------------------------------------------------------

message CorrectExpenseRequest {
  string expense_id = 1;
  string user_id = 2;
  string name = 3;
  int64 amount = 4;
  string expense_type = 5;
  string tag_id = 6;
  string expense_date = 7;
  string transaction_currency = 8;
  string currency = 9; // Deprecated alias during rollout.
}

// ---------------------------------------------------------------------------
// Messages with no RPC: correction-history and pro-rata reads are served over
// REST. Retained because an external gRPC client mock still references these types.
// ---------------------------------------------------------------------------

message GetCorrectionHistoryRequest {
  string expense_id = 1;
}

message CorrectionHistoryResponse {
  repeated ExpenseData entries = 1;
}

message GetProRataGroupRequest {
  string group_id = 1;
}

// ---------------------------------------------------------------------------
// StreamAllUserExpenses (data export, server-streaming)
// ---------------------------------------------------------------------------

message StreamAllUserExpensesRequest {
  string user_id = 1;
  int32 page_size = 2; // internal server-side keyset page size; 0 = server default
}

// ---------------------------------------------------------------------------
// CountExpensesByTag
// ---------------------------------------------------------------------------

message CountExpensesByTagRequest {
  string tag_id = 1;
  string user_id = 2;
}

message CountExpensesByTagResponse {
  int64 count = 1;
}

// ---------------------------------------------------------------------------
// AnonymizeAllUserExpenses (GDPR deletion)
// ---------------------------------------------------------------------------

message AnonymizeRequest {
  string user_id = 1;
}

message AnonymizeResponse {}
