syntax = "proto3";

package expense;

option go_package = "github.com/ItsThompson/gofin/services/expense/proto/expensepb";

service ExpenseService {
  rpc CreateExpense(CreateExpenseRequest) returns (ExpenseResponse);
  rpc GetExpensesForPeriod(GetExpensesForPeriodRequest) returns (ExpenseListResponse);
  rpc GetExpense(GetExpenseRequest) returns (ExpenseResponse);

  // Tag usage check (called by finance service during tag deletion)
  rpc CountExpensesByTag(CountExpensesByTagRequest) returns (CountExpensesByTagResponse);

  // Data export streaming: the server streams every expense (active + corrected)
  // for a user in chronological order (created_at ASC, id ASC). The server pages
  // internally with a keyset cursor, bounding server memory to O(page_size); the
  // client writes rows incrementally.
  rpc StreamAllUserExpenses(StreamAllUserExpensesRequest) returns (stream ExpenseData);

  // GDPR: anonymize all expenses for a user (field redaction, not deletion)
  rpc AnonymizeAllUserExpenses(AnonymizeRequest) returns (AnonymizeResponse);

  // Correction flow (mutates the ledger; REST is the primary consumer).
  rpc CorrectExpense(CorrectExpenseRequest) returns (ExpenseResponse);
}

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

message ExpenseData {
  string id = 1;
  string user_id = 2;
  string name = 3;
  int64 amount = 4;
  string currency = 5;
  string expense_type = 6;
  string tag_id = 7;
  string expense_date = 8;
  int32 period_year = 9;
  int32 period_month = 10;
  string status = 11;
  string corrects_id = 12;
  bool is_pro_rata = 13;
  string pro_rata_group = 14;
  int32 pro_rata_index = 15;
  int32 pro_rata_total = 16;
  string created_at = 17;
}

// ---------------------------------------------------------------------------
// CreateExpense
// ---------------------------------------------------------------------------

message CreateExpenseRequest {
  string user_id = 1;
  string name = 2;
  int64 amount = 3;
  string currency = 4;
  string expense_type = 5;
  string tag_id = 6;
  string expense_date = 7;
  int32 period_year = 8;
  int32 period_month = 9;
  bool is_pro_rata = 10;
  string pro_rata_group = 11;
  int32 pro_rata_index = 12;
  int32 pro_rata_total = 13;
}

message ExpenseResponse {
  ExpenseData expense = 1;
}

// ---------------------------------------------------------------------------
// GetExpensesForPeriod
// ---------------------------------------------------------------------------

message GetExpensesForPeriodRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ExpenseListResponse {
  repeated ExpenseData data = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

// ---------------------------------------------------------------------------
// GetExpense
// ---------------------------------------------------------------------------

message GetExpenseRequest {
  string id = 1;
  string user_id = 2;
}

// ---------------------------------------------------------------------------
// CorrectExpense request
// ---------------------------------------------------------------------------

message CorrectExpenseRequest {
  string expense_id = 1;
  string user_id = 2;
  string name = 3;
  int64 amount = 4;
  string expense_type = 5;
  string tag_id = 6;
  string expense_date = 7;
}

// ---------------------------------------------------------------------------
// Messages with no RPC: correction-history and pro-rata reads are served over
// REST. Retained because an external gRPC client mock still references these types.
// ---------------------------------------------------------------------------

message GetCorrectionHistoryRequest {
  string expense_id = 1;
}

message CorrectionHistoryResponse {
  repeated ExpenseData entries = 1;
}

message GetProRataGroupRequest {
  string group_id = 1;
}

// ---------------------------------------------------------------------------
// StreamAllUserExpenses (data export, server-streaming)
// ---------------------------------------------------------------------------

message StreamAllUserExpensesRequest {
  string user_id = 1;
  int32 page_size = 2; // internal server-side keyset page size; 0 = server default
}

// ---------------------------------------------------------------------------
// CountExpensesByTag
// ---------------------------------------------------------------------------

message CountExpensesByTagRequest {
  string tag_id = 1;
  string user_id = 2;
}

message CountExpensesByTagResponse {
  int64 count = 1;
}

// ---------------------------------------------------------------------------
// AnonymizeAllUserExpenses (GDPR deletion)
// ---------------------------------------------------------------------------

message AnonymizeRequest {
  string user_id = 1;
}

message AnonymizeResponse {}
