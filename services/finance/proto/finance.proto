syntax = "proto3";

package finance;

option go_package = "github.com/ItsThompson/gofin/services/finance/proto/financepb";

service FinanceService {
  // Default settings
  rpc GetDefaults(GetDefaultsRequest) returns (DefaultsResponse);
  rpc UpdateDefaults(UpdateDefaultsRequest) returns (DefaultsResponse);
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (DefaultsResponse);

  // Currency catalog
  rpc ListSupportedCurrencies(ListSupportedCurrenciesRequest) returns (ListSupportedCurrenciesResponse);

  // Data export (datarights support)
  rpc GetAllUserData(GetAllUserDataRequest) returns (AllUserDataResponse);

  // Data deletion (datarights support)
  rpc DeleteAllUserData(DeleteAllUserDataRequest) returns (DeleteAllUserDataResponse);

  // Budget period operations
  rpc GetCurrentPeriod(GetCurrentPeriodRequest) returns (PeriodResponse);
  rpc CreatePeriod(CreatePeriodRequest) returns (PeriodResponse);
  rpc UpdatePeriod(UpdatePeriodRequest) returns (PeriodResponse);
  rpc ListPeriods(ListPeriodsRequest) returns (PeriodListResponse);
  rpc GetPeriodContext(GetPeriodContextRequest) returns (GetPeriodContextResponse);

  // Tag operations
  rpc ListTags(ListTagsRequest) returns (TagListResponse);
  rpc CreateTag(CreateTagRequest) returns (TagResponse);
  rpc UpdateTag(UpdateTagRequest) returns (TagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc CheckTagUsage(CheckTagUsageRequest) returns (TagUsageResponse);

  // Pro-rata
  rpc CreateProRataExpense(CreateProRataExpenseRequest) returns (ProRataResponse);
  rpc GetUpcomingProRata(GetUpcomingProRataRequest) returns (UpcomingProRataListResponse);

  // Dashboard aggregation
  rpc GetPeriodSummary(GetPeriodSummaryRequest) returns (PeriodSummaryResponse);
  rpc GetSpendingByTag(GetSpendingByTagRequest) returns (TagSpendingListResponse);
  rpc GetCumulativeSpend(GetCumulativeSpendRequest) returns (CumulativeSpendResponse);
  rpc GetHistoricalComparison(GetHistoricalComparisonRequest) returns (HistoricalComparisonResponse);
}

// ---------------------------------------------------------------------------
// Default settings
// ---------------------------------------------------------------------------

message DefaultsData {
  string user_id = 1;
  int64 budget_amount = 2;
  int32 essentials_percent = 3;
  int32 desires_percent = 4;
  int32 savings_percent = 5;
  string currency = 6;
}

message GetDefaultsRequest {
  string user_id = 1;
}

message UpdateDefaultsRequest {
  string user_id = 1;
  int64 budget_amount = 2;
  int32 essentials_percent = 3;
  int32 desires_percent = 4;
  int32 savings_percent = 5;
  string currency = 6;
}

message CompleteOnboardingRequest {
  string user_id = 1;
  int64 budget_amount = 2;
  int32 essentials_percent = 3;
  int32 desires_percent = 4;
  int32 savings_percent = 5;
  string currency = 6;
}

message DefaultsResponse {
  DefaultsData defaults = 1;
}

// ---------------------------------------------------------------------------
// Currency catalog
// ---------------------------------------------------------------------------

message CurrencyData {
  string code = 1;
  string symbol = 2;
  string name = 3;
  int32 minor_unit_digits = 4;
}

message ListSupportedCurrenciesRequest {}

message ListSupportedCurrenciesResponse {
  repeated CurrencyData currencies = 1;
}

// ---------------------------------------------------------------------------
// Data export (datarights support)
// ---------------------------------------------------------------------------

message GetAllUserDataRequest {
  string user_id = 1;
}

message AllUserDataResponse {
  repeated TagData tags = 1;
  repeated PeriodData periods = 2;
  DefaultsData defaults = 3;
}

// ---------------------------------------------------------------------------
// Data deletion (datarights support)
// ---------------------------------------------------------------------------

message DeleteAllUserDataRequest {
  string user_id = 1;
}

message DeleteAllUserDataResponse {}

// ---------------------------------------------------------------------------
// Budget periods
// ---------------------------------------------------------------------------

message PeriodData {
  string id = 1;
  string user_id = 2;
  int32 year = 3;
  int32 month = 4;
  int64 budget_amount = 5;
  int32 essentials_percent = 6;
  int32 desires_percent = 7;
  int32 savings_percent = 8;
  string created_at = 9;
  string reporting_currency = 10;
}

message GetCurrentPeriodRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message CreatePeriodRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
  int64 budget_amount = 4;
  int32 essentials_percent = 5;
  int32 desires_percent = 6;
  int32 savings_percent = 7;
  string reporting_currency = 8;
}

message UpdatePeriodRequest {
  string period_id = 1;
  string user_id = 2;
  int64 budget_amount = 3;
  int32 essentials_percent = 4;
  int32 desires_percent = 5;
  int32 savings_percent = 6;
}

message ListPeriodsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message PeriodResponse {
  PeriodData period = 1;
}

message PeriodListResponse {
  repeated PeriodData periods = 1;
  int32 total = 2;
}

message GetPeriodContextRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message GetPeriodContextResponse {
  string period_id = 1;
  string user_id = 2;
  int32 year = 3;
  int32 month = 4;
  string reporting_currency = 5;
  bool is_locked = 6;
}

// ---------------------------------------------------------------------------
// Tags
// ---------------------------------------------------------------------------

message TagData {
  string id = 1;
  string user_id = 2;
  string name = 3;
  bool is_default = 4;
  string created_at = 5;
}

message ListTagsRequest {
  string user_id = 1;
}

message CreateTagRequest {
  string user_id = 1;
  string name = 2;
}

message UpdateTagRequest {
  string tag_id = 1;
  string user_id = 2;
  string name = 3;
}

message DeleteTagRequest {
  string tag_id = 1;
  string user_id = 2;
}

message DeleteTagResponse {}

message CheckTagUsageRequest {
  string tag_id = 1;
}

message TagUsageResponse {
  bool in_use = 1;
}

message TagResponse {
  TagData tag = 1;
}

message TagListResponse {
  repeated TagData tags = 1;
}

// ---------------------------------------------------------------------------
// Pro-rata
// ---------------------------------------------------------------------------

message CreateProRataExpenseRequest {
  string user_id = 1;
  string name = 2;
  int64 total_amount = 3;
  string currency = 4;
  string expense_type = 5;
  string tag_id = 6;
  string expense_date = 7;
  int32 months = 8;
  string transaction_currency = 9;
}

message ProRataResponse {
  string message = 1;
}

message GetUpcomingProRataRequest {
  string user_id = 1;
}

message UpcomingProRataListResponse {
  string message = 1;
}

// ---------------------------------------------------------------------------
// Dashboard aggregation
// ---------------------------------------------------------------------------

message GetPeriodSummaryRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message PeriodSummaryResponse {
  string message = 1;
}

message GetSpendingByTagRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message TagSpendingListResponse {
  string message = 1;
}

message GetCumulativeSpendRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message CumulativeSpendResponse {
  string message = 1;
}

message GetHistoricalComparisonRequest {
  string user_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message HistoricalComparisonResponse {
  string message = 1;
}
